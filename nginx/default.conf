server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location = /health {
        default_type text/plain;
        return 200 "workshop-ready\n";
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }
}
